services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    volumes:
      - ../:/app
    depends_on:
      - db
    container_name: spotiko_api

  front:
    build:
      context: .
      dockerfile: ./front/Dockerfile
    volumes:
      - ../:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    container_name: spotiko_front

  apache:
    build:
      context: .
      dockerfile: ./apache/Dockerfile
    ports:
      - "1111:80"
    depends_on:
      - api
      - front
    volumes:
      - ../:/app
    container_name: spotiko_apache

  db:
    build:
      context: .
      dockerfile: ./db/Dockerfile
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: spotiko
      MYSQL_USER: spotiko
      MYSQL_PASSWORD: sa
      MYSQL_ROOT_PASSWORD: sa
      TZ: 'Asia/Tokyo'
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/work:/docker-entrypoint-initdb.d/
    container_name: spotiko_db
