<VirtualHost *:80>
    ServerName example.com
    DocumentRoot "/app/public"

    <Directory "/app/public">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Authorizationヘッダーの引き継ぎ
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # 末尾スラッシュを除去
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # 実ファイル(Reactのビルド成果物やLaravelの静的ファイル)はそのまま配信
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # /api, /sanctum はLaravel(index.php)へ
        RewriteRule ^(api|sanctum)(/|$) index.php [L]

        # それ以外はReact SPA(index.html)へフォールバック。クライアントサイド
        # ルーティングでの直接アクセス・リロードに対応するため。
        RewriteRule ^ index.html [L]
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://api:9000"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
