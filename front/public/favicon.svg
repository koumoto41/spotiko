<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="32" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#26262f"/>

  <g filter="url(#glow)">
    <rect x="6" y="15" width="4" height="11" rx="2" fill="url(#bar)"/>
    <rect x="14" y="8" width="4" height="18" rx="2" fill="url(#bar)"/>
    <rect x="22" y="12" width="4" height="14" rx="2" fill="url(#bar)"/>
  </g>
</svg>
